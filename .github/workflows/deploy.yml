name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - release   # 🚀 solo se ejecuta en commits a la rama release

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Show secret exists
        run: echo "Token length: ${#FIREBASE_TOKEN}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
